spring.application.name=pesaje-service
server.port=8083

# Configuración de Oracle XE (Cambiado a XEPDB1 por compatibilidad con v21c)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=tu_usuario_oracle
spring.datasource.password=tu_contraseña_oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cliente de Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/