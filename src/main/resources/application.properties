spring.application.name=pesaje-service
server.port=8085

# --- CONFIGURACION ORACLE CLOUD ---
# NOTA: Asegúrate de que la carpeta C:/OracleWallet contenga el archivo cwallet.sso
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@clases_high?TNS_ADMIN=C:/OracleWallet
spring.datasource.username=ADMIN
spring.datasource.password=Pabloneruda#334

# CONFIGURACIÓN CRÍTICA: Limitar el Pool para el Free Tier de Oracle
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# --- Configuración de JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ELIMINADO: spring.jpa.properties.hibernate.dialect (Hibernate ya lo detecta solo)
# AGREGADO: Desactivar open-in-view para evitar warnings innecesarios en consola
spring.jpa.open-in-view=false

# --- Cliente de Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Corrección para el conflicto de Beans de Swagger/HATEOAS
spring.main.allow-bean-definition-overriding=true